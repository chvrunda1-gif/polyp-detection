<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolyScope – Patient Registration</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/static/css/common.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #0d1629 0%, #060912 70%);
      padding: 30px 20px;
    }
    .auth-box {
      width: 100%;
      max-width: 520px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 38px 34px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
  </style>
</head>
<body>

  <div class="auth-box">
    <div class="auth-logo">
      <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,rgba(0,229,160,0.2),rgba(0,184,255,0.2));border:1px solid rgba(0,229,160,0.3);display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00e5a0" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="3" fill="#00b8ff"/>
        </svg>
      </div>
      <div>
        <h2 style="font-family:var(--font-display);font-size:1.3rem;line-height:1.1;">PolyScope AI</h2>
        <span style="font-size:0.75rem;color:var(--text-muted);">Patient Account Registration</span>
      </div>
    </div>

    <form id="regForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="regName" class="form-input" placeholder="e.g. Eleanor Vance" required>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="regEmail" class="form-input" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password (Minimum 6 characters)</label>
        <input type="password" id="regPassword" class="form-input" placeholder="••••••••" minlength="6" required>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label">Age</label>
          <input type="number" id="regAge" class="form-input" placeholder="52" min="1" max="120">
        </div>
        <div class="form-group">
          <label class="form-label">Gender</label>
          <select id="regGender" class="form-select">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Contact Phone</label>
        <input type="tel" id="regPhone" class="form-input" placeholder="+1 (555) 000-0000">
      </div>

      <button type="submit" id="regBtn" class="btn btn-primary" style="width:100%;padding:12px;font-size:0.95rem;margin-top:10px;">
        Complete Registration →
      </button>
    </form>

    <div style="text-align:center;margin-top:20px;font-size:0.85rem;color:var(--text-muted);">
      Already have an account? <a href="/login.html" style="color:var(--cyan);font-weight:600;">Sign In</a>
    </div>

    <div style="text-align:center;margin-top:20px;">
      <a href="/" style="font-size:0.8rem;color:var(--text-dim);">← Back to Website Homepage</a>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/static/js/auth.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('regName').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        password: document.getElementById('regPassword').value,
        age: document.getElementById('regAge').value,
        gender: document.getElementById('regGender').value,
        phone: document.getElementById('regPhone').value.trim(),
        role: 'patient'
      };

      const btn = document.getElementById('regBtn');
      btn.disabled = true;
      btn.textContent = 'Registering Account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');

        showToast('Registration successful! Please sign in.', 'success');
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1000);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Complete Registration →';
      }
    }
  </script>
</body>
</html>
