<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PolyScope — Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #05080f;
    --surface: #0c1120;
    --card: #101828;
    --border: rgba(255,255,255,0.07);
    --accent: #00e5a0;
    --accent2: #00b8ff;
    --danger: #ff4d6d;
    --text: #e8edf5;
    --muted: #6b7a99;
    --field-label: #b8c6e2;
    --field-placeholder: #93a4c6;
    --radius: 16px;
  }

  html, body { height: 100%; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ── Left Panel ── */
  .left-panel {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px;
    overflow: hidden;
  }

  .left-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 20% 30%, rgba(0,229,160,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 80% 70%, rgba(0,184,255,0.10) 0%, transparent 60%);
    pointer-events: none;
  }

  .scan-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(0,229,160,0.15);
    animation: pulseGlow 4s ease-in-out infinite;
  }
  .scan-ring:nth-child(1) { width: 300px; height: 300px; animation-delay: 0s; }
  .scan-ring:nth-child(2) { width: 480px; height: 480px; animation-delay: 1s; }
  .scan-ring:nth-child(3) { width: 660px; height: 660px; animation-delay: 2s; }

  @keyframes pulseGlow {
    0%, 100% {
      transform: scale(1);
      opacity: 0.3;
      border-color: rgba(0,229,160,0.15);
      box-shadow: 0 0 20px rgba(0,229,160,0.1);
    }
    50% {
      transform: scale(1.1);
      opacity: 0.6;
      border-color: rgba(0,229,160,0.4);
      box-shadow: 0 0 40px rgba(0,229,160,0.3), 0 0 80px rgba(0,184,255,0.2);
    }
  }

  .floating-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0.6;
    animation: floatParticle 8s ease-in-out infinite;
  }

  .particle:nth-child(1) {
    top: 20%; left: 15%;
    animation-delay: 0s;
    animation-duration: 6s;
  }
  .particle:nth-child(2) {
    top: 60%; left: 80%;
    animation-delay: 2s;
    animation-duration: 7s;
  }
  .particle:nth-child(3) {
    top: 40%; left: 60%;
    animation-delay: 4s;
    animation-duration: 5s;
  }
  .particle:nth-child(4) {
    top: 80%; left: 25%;
    animation-delay: 1s;
    animation-duration: 8s;
  }
  .particle:nth-child(5) {
    top: 15%; left: 70%;
    animation-delay: 3s;
    animation-duration: 6.5s;
  }

  @keyframes floatParticle {
    0%, 100% {
      transform: translateY(0px) translateX(0px) scale(1);
      opacity: 0.3;
    }
    25% {
      transform: translateY(-20px) translateX(15px) scale(1.2);
      opacity: 0.8;
    }
    50% {
      transform: translateY(-10px) translateX(-10px) scale(0.8);
      opacity: 0.5;
    }
    75% {
      transform: translateY(15px) translateX(20px) scale(1.1);
      opacity: 0.7;
    }
  }

  .logo-mark {
    width: 80px; height: 80px;
    border-radius: 24px;
    background: linear-gradient(135deg, rgba(0,229,160,0.2), rgba(0,184,255,0.2));
    border: 1px solid rgba(0,229,160,0.3);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 32px;
    position: relative;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .logo-mark:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(0,229,160,0.4), 0 0 60px rgba(0,184,255,0.3);
    animation: logoGlow 2s ease-in-out infinite;
  }

  @keyframes logoGlow {
    0%, 100% {
      box-shadow: 0 0 30px rgba(0,229,160,0.4), 0 0 60px rgba(0,184,255,0.3);
    }
    50% {
      box-shadow: 0 0 40px rgba(0,229,160,0.6), 0 0 80px rgba(0,184,255,0.5);
    }
  }
  .logo-mark svg { width: 44px; height: 44px; }

  .brand-name {
    font-family: 'DM Serif Display', serif;
    font-size: 2.4rem;
    letter-spacing: -0.5px;
    line-height: 1;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .brand-tagline {
    font-size: 0.95rem;
    color: var(--muted);
    line-height: 1.6;
    margin-top: 12px;
  }

  .feature-pills {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 40px;
  }

  .pill {
    font-size: 0.78rem;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 100px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .pill span { color: var(--accent); }

  /* ── Right Panel ── */
  .right-panel {
    width: 480px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 48px;
    position: relative;
  }

  .form-header {
    margin-bottom: 40px;
    animation: slideUpFade 0.6s ease forwards;
    opacity: 0;
    transform: translateY(20px);
  }
  .form-title {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .form-subtitle { font-size: 0.9rem; color: var(--muted); }
  .form-subtitle a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .form-subtitle a:hover { text-decoration: underline; }

  .input-group {
    margin-bottom: 20px;
    animation: slideUpFade 0.6s ease forwards;
    opacity: 0;
    transform: translateY(20px);
  }
  .input-group:nth-child(1) { animation-delay: 0.1s; }
  .input-group:nth-child(2) { animation-delay: 0.2s; }

  @keyframes slideUpFade {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--field-label);
    margin-bottom: 8px;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"] {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus {
    border-color: rgba(0,229,160,0.5);
    box-shadow: 0 0 0 3px rgba(0,229,160,0.08);
  }

  input::placeholder { color: var(--field-placeholder); }

  .btn-primary {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--accent), #00c88a);
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: #05080f;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    animation: slideUpFade 0.6s ease forwards;
    animation-delay: 0.3s;
    opacity: 0;
    transform: translateY(20px);
  }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .error-msg {
    background: rgba(255,77,109,0.1);
    border: 1px solid rgba(255,77,109,0.25);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.85rem;
    color: var(--danger);
    margin-bottom: 20px;
    display: none;
    align-items: center; gap: 8px;
  }
  .error-msg.show { display: flex; }

  .success-msg {
    background: rgba(0,229,160,0.1);
    border: 1px solid rgba(0,229,160,0.25);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.85rem;
    color: var(--accent);
    margin-bottom: 20px;
    display: none;
    align-items: center; gap: 8px;
  }
  .success-msg.show { display: flex; }

  .divider { display: flex; align-items: center; gap: 12px; margin: 28px 0; }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }
  .divider span { font-size: 0.8rem; color: var(--muted); }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(5,8,15,0.3);
    border-top-color: #05080f;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .scan-line {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: rotateScan 3s linear infinite;
    opacity: 0.5;
  }
  @keyframes rotateScan {
    0% { transform: rotate(0deg) translateX(-100%); }
    25% { transform: rotate(90deg) translateX(0%); }
    50% { transform: rotate(180deg) translateX(100%); }
    75% { transform: rotate(270deg) translateX(0%); }
    100% { transform: rotate(360deg) translateX(-100%); }
  }

  @media (max-width: 900px) {
    .left-panel { display: none; }
    .right-panel { width: 100%; border: none; }
  }
</style>
</head>
<body>

<!-- Left Visual Panel -->
<div class="left-panel">
  <div class="scan-ring"></div>
  <div class="scan-ring"></div>
  <div class="scan-ring"></div>

  <div class="floating-particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="panel-content">
    <div class="logo-mark">
      <svg viewBox="0 0 44 44" fill="none">
        <circle cx="22" cy="22" r="18" stroke="url(#g1)" stroke-width="1.5"/>
        <circle cx="22" cy="22" r="8" fill="url(#g2)" opacity="0.6"/>
        <path d="M14 22 Q18 16 22 22 Q26 28 30 22" stroke="url(#g1)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="44" y2="44">
            <stop offset="0%" stop-color="#00e5a0"/>
            <stop offset="100%" stop-color="#00b8ff"/>
          </linearGradient>
          <radialGradient id="g2" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00e5a0"/>
            <stop offset="100%" stop-color="#00b8ff"/>
          </radialGradient>
        </defs>
      </svg>
    </div>

    <div class="brand-name">PolyScope AI</div>
    <p class="brand-tagline">
      A research prototype for colonoscopy-image segmentation. Not validated for clinical use.
    </p>

    <div class="feature-pills">
      <div class="pill"><span>✦</span> Research Prototype</div>
      <div class="pill"><span>✦</span> Segmentation Training</div>
      <div class="pill"><span>✦</span> Private User Sessions</div>
    </div>
  </div>
</div>

<!-- Right Login Panel -->
<div class="right-panel">
  <div class="scan-line"></div>

  <div class="form-header">
    <div class="form-title">Welcome back</div>
    <p class="form-subtitle">
      No account? <a href="register.html">Register here</a>
    </p>
  </div>

  <div class="error-msg" id="errorMsg">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
      <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm-.75 4a.75.75 0 0 1 1.5 0v3a.75.75 0 0 1-1.5 0V5zm.75 7a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
    </svg>
    <span id="errorText"></span>
  </div>

  <div class="success-msg" id="successMsg">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
      <path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0z"/>
    </svg>
    <span id="successText"></span>
  </div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="input-group">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="doctor@hospital.com" required />
    </div>

    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required />
    </div>

    <button type="submit" class="btn-primary" id="loginBtn">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Sign In</span>
    </button>
  </form>

  <div class="divider" id="demoDivider"><span>or continue as demo</span></div>

  <button class="btn-primary" id="demoBtn" onclick="handleDemo()" style="background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--border);">
    Use Demo Account
  </button>
</div>

<script>
  const API = '/api';

  async function handleLogin(e) {
    e.preventDefault();
    hideMessages();
    setLoading(true);

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      const res = await fetch(`${API}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Login failed');
      } else {
        showSuccess(`Welcome back, ${data.name}!`);
        sessionStorage.setItem('user', JSON.stringify({ name: data.name, email: data.email }));
        sessionStorage.setItem('csrf_token', data.csrf_token);
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      }
    } catch {
      showError('Cannot connect to server. Is Flask running?');
    } finally {
      setLoading(false);
    }
  }

  async function handleDemo() {
    document.getElementById('email').value = 'demo@polyscope.ai';
    document.getElementById('password').value = 'demo1234';

    try {
      const configResponse = await fetch(`${API}/config`);
      const config = await configResponse.json();
      if (!config.demo_enabled) {
        showError('Demo sign-in is disabled on this deployment.');
        return;
      }
      const registration = await fetch(`${API}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: 'Demo User', email: 'demo@polyscope.ai', password: 'demo1234' })
      });
      if (!registration.ok && registration.status !== 409) {
        showError('Could not prepare the demo account.');
        return;
      }
      document.getElementById('loginForm').requestSubmit();
    } catch {
      showError('Cannot connect to server. Is Flask running?');
    }
  }

  function setLoading(on) {
    const btn = document.getElementById('loginBtn');
    const spinner = document.getElementById('spinner');
    const text = document.getElementById('btnText');
    btn.disabled = on;
    spinner.style.display = on ? 'block' : 'none';
    text.textContent = on ? 'Signing in…' : 'Sign In';
  }

  function showError(msg) {
    document.getElementById('errorText').textContent = msg;
    document.getElementById('errorMsg').classList.add('show');
  }

  function showSuccess(msg) {
    document.getElementById('successText').textContent = msg;
    document.getElementById('successMsg').classList.add('show');
  }

  function hideMessages() {
    document.getElementById('errorMsg').classList.remove('show');
    document.getElementById('successMsg').classList.remove('show');
  }

  async function initializeLogin() {
    try {
      const [configResponse, sessionResponse] = await Promise.all([
        fetch(`${API}/config`),
        fetch(`${API}/me`)
      ]);
      const config = await configResponse.json();
      if (!config.demo_enabled) {
        document.getElementById('demoBtn').hidden = true;
        document.getElementById('demoDivider').hidden = true;
      }
      if (sessionResponse.ok) {
        window.location.href = 'dashboard.html';
      } else {
        sessionStorage.removeItem('user');
        sessionStorage.removeItem('csrf_token');
      }
    } catch {
      showError('Cannot connect to server. Is Flask running?');
    }
  }

  initializeLogin();
</script>
</body>
</html>
